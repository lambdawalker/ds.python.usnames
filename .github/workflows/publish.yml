name: Build and publish Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools and library
        run: python -m pip install build twine .
      - name: Test library
        run: python -m unittest discover -s tests -v
      - name: Check versions and release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from us_names.core import VERSION
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          if project['version'] != VERSION:
              raise SystemExit('pyproject.toml version and generator VERSION must match')
          if os.environ['EVENT_NAME'] == 'release':
              expected = 'v' + project['version']
              if os.environ['RELEASE_TAG'] != expected:
                  raise SystemExit(f'Release tag must be {expected}')
          print(f"Building {project['name']} {project['version']}")
          PY
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Test installed wheel outside the checkout
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -I -c 'from us_names import Dataset, Generator, Query, download_dataset; print(Query())'
          /tmp/wheel-check/bin/python -I -m us_names --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.repository == 'lambdawalker/ds.python.usnames'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/us-synthetic-names
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
