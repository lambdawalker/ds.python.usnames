name: Release and publish Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release PR or create merged release
    if: github.repository == 'lambdawalker/ds.python.usnames' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release
    if: always() && !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Validate the generated PR as well: bot-created PRs do not trigger CI.
          ref: ${{ needs.release.outputs.sha || fromJSON(needs.release.outputs.pr || '{}').headBranchName || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools and library
        run: python -m pip install build twine .
      - name: Test library
        run: python -m unittest discover -s tests -v
      - name: Check versions and release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ needs.release.outputs.tag || github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from us_names.core import VERSION
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          lock = tomllib.loads(Path('uv.lock').read_text())
          locked = next(p['version'] for p in lock['package'] if p['name'] == project['name'])
          if locked != project['version']:
              raise SystemExit('uv.lock project version must match pyproject.toml')
          if project['version'] != VERSION:
              raise SystemExit('pyproject.toml version and generator VERSION must match')
          if os.environ['RELEASE_TAG']:
              expected = 'v' + project['version']
              if os.environ['RELEASE_TAG'] != expected:
                  raise SystemExit(f'Release tag must be {expected}')
          print(f"Building {project['name']} {project['version']}")
          PY
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Test installed wheel outside the checkout
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -I -c 'from us_names import Dataset, Generator, Query, download_dataset; print(Query())'
          /tmp/wheel-check/bin/python -I -m us_names --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: always() && needs.build.result == 'success' && github.repository == 'lambdawalker/ds.python.usnames' && (needs.release.outputs.created == 'true' || github.event_name == 'release')
    needs: [release, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/us-synthetic-names
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
